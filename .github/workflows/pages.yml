name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare production presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # Keep the presenter's name only once, as the concept-preparation credit.
          replacements = [
              ('A premium TV program concept for Al Jadeed, presented and prepared by Elissa Fahd.',
               'A premium TV program concept presentation for Al Jadeed.'),
              ('10 / Why Elissa Fahd', '10 / Host profile'),
              ('10 / Why Elissa', '10 / Host profile'),
              ('<p class="side-note">Presented &amp; Prepared by Elissa Fahd<br>Research snapshot · 22 Aug 2026</p>',
               '<p class="side-note">Program concept presentation<br>Research snapshot · 22 Aug 2026</p>'),
              ('A premium weekly interview format where Elissa Fahd meets the founders, investors, executives and business families behind the decisions, risks and turning points that shaped their success.',
               'A premium weekly interview format built around conversations with founders, investors, executives and business families, uncovering the decisions, risks and turning points that shaped their success.'),
              ('<div><span>Host</span><b>Elissa Fahd</b></div>',
               '<div><span>Interview style</span><b>Host-led</b></div>'),
              ('<div class="credit reveal">Presented &amp; Prepared by <b>Elissa Fahd</b></div>', ''),
              ('Elissa’s on-screen role', 'The on-screen role'),
              ('The pitch presents the host role and the on-screen standard the format is designed to build around Elissa.',
               'The pitch presents the host role and the on-screen standard the format is designed to achieve.'),
              ('<div class="final-credit"><span>Presented &amp; Prepared by</span><strong>Elissa Fahd</strong><small>Program concept presentation · Al Jadeed · August 2026</small></div>',
               '<div class="final-credit"><span>Concept prepared by</span><strong>Elissa Fahd</strong><small>Program concept presentation · Al Jadeed · August 2026</small></div>'),
          ]
          for old, new in replacements:
              html = html.replace(old, new)

          # Add the budget chapter to the navigation and renumber later chapters.
          nav_old = '<a href="#commercial">13 / Commercial potential</a>\n        <a href="#aljadeed">14 / Why Al Jadeed</a>\n        <a href="#growth">15 / Growth path</a>\n        <a href="#proposal">16 / Closing proposal</a>'
          nav_new = '<a href="#budget">13 / Budget &amp; production investment</a>\n        <a href="#commercial">14 / Commercial potential</a>\n        <a href="#aljadeed">15 / Why Al Jadeed</a>\n        <a href="#growth">16 / Growth path</a>\n        <a href="#proposal">17 / Closing proposal</a>'
          html = html.replace(nav_old, nav_new)

          chapter_replacements = [
              ('<span class="section-label">13 / Commercial potential</span>', '<span class="section-label">14 / Commercial potential</span>'),
              ('<span class="section-label">14 / Why Al Jadeed</span>', '<span class="section-label">15 / Why Al Jadeed</span>'),
              ('<span class="section-label">15 / Growth potential</span>', '<span class="section-label">16 / Growth potential</span>'),
              ('<span class="section-label">16 / Closing proposal</span>', '<span class="section-label">17 / Closing proposal</span>'),
          ]
          for old, new in chapter_replacements:
              html = html.replace(old, new)

          budget_fragment = Path('budget-section.html').read_text(encoding='utf-8').rstrip()
          if 'id="budget"' not in html:
              marker = '      <section id="commercial">'
              if marker not in html:
                  raise SystemExit('Commercial section marker not found for budget insertion')
              html = html.replace(marker, budget_fragment + '\n\n' + marker, 1)

          # Remove em dashes from all visible source copy in the deployed site.
          html = re.sub(r'\s*—\s*', ', ', html)

          # Safety check: the deployed HTML must contain the presenter's name only in the final credit.
          if html.count('Elissa Fahd') != 1 or html.count('Elissa') != 1 or html.count('Fahd') != 1:
              raise SystemExit(
                  f'Unexpected presenter-name references: full={html.count("Elissa Fahd")}, '
                  f'first={html.count("Elissa")}, last={html.count("Fahd")}'
              )

          production_css = '\n'.join([
              '<link rel="stylesheet" href="study-nav.css?v=20260822-1">',
              '<link rel="stylesheet" href="presentation-fixes.css?v=20260822-1">',
              '<link rel="stylesheet" href="typography-fix.css?v=20260822-1">',
              '<link rel="stylesheet" href="budget-section.css?v=20260822-1">',
              '<link rel="stylesheet" href="whatsapp-cta.css?v=20260822-1">',
          ])
          if 'budget-section.css?v=20260822-1' not in html:
              html = html.replace('</head>', production_css + '\n</head>')

          scripts = '\n'.join([
              '<script src="study-nav.js?v=20260822-2"></script>',
              '<script src="whatsapp-cta.js?v=20260822-1"></script>',
          ])
          if 'whatsapp-cta.js?v=20260822-1' not in html:
              html = html.replace('</body>', scripts + '\n</body>')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
