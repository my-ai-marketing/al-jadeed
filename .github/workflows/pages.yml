name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare production presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # Remove em dashes from all visible source copy in the deployed site.
          html = re.sub(r'\s*—\s*', ', ', html)

          production_css = '\n'.join([
              '<link rel="stylesheet" href="study-nav.css?v=20260822-1">',
              '<link rel="stylesheet" href="presentation-fixes.css?v=20260822-1">',
              '<link rel="stylesheet" href="typography-fix.css?v=20260822-1">',
          ])
          if 'typography-fix.css?v=20260822-1' not in html:
              html = html.replace('</head>', production_css + '\n</head>')

          nav_script = '<script src="study-nav.js?v=20260822-1"></script>'
          if nav_script not in html:
              html = html.replace('</body>', nav_script + '\n</body>')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
